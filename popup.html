<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>uLearn tasks</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 380px; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
    header h1 { font-size: 14px; margin: 0; flex: 1; }
    #banner { padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--card); }
    #banner[hidden] { display: none; }
    main { max-height: 480px; overflow-y: auto; padding: 4px 0 8px; }
    h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; margin: 10px 12px 4px; color: var(--muted); }
    h2.overdue { color: var(--danger); }
    ul { list-style: none; margin: 0; padding: 0; }
    li { display: flex; gap: 8px; padding: 6px 12px; align-items: flex-start; }
    li:hover { background: var(--card); }
    li input { margin-top: 3px; }
    .body { flex: 1; min-width: 0; }
    .name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { font-size: 12px; color: var(--muted); }
    .due.overdue { color: var(--danger); }
    .due.soon { color: var(--warn); }
    li.done .name { text-decoration: line-through; color: var(--muted); }
    details summary { cursor: pointer; margin: 10px 12px 4px; font-size: 11px; text-transform: uppercase; color: var(--muted); }
    .empty { padding: 24px 12px; text-align: center; }
    footer { display: flex; justify-content: space-between; padding: 6px 12px; border-top: 1px solid var(--line); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">uLearn tasks</h1>
    <button id="sync" title="Sync now">Sync</button>
  </header>
  <div id="banner" hidden></div>
  <main id="list"></main>
  <footer>
    <span id="status" class="muted"></span>
    <a href="options.html" target="_blank">Settings</a>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
